# Phase 7: Expanded Edwards-Anderson frustrated campaign
# Nature-level upgrade — needs ≥30 relaxed EA instances per QPU with
# quantum conditional Gibbs target ≥2x tighter than classical

# --- QPU settings ---
qpus:
  advantage2:
    solver: Advantage2_system1
    topology: zephyr
  system64:
    solver: Advantage_system6.4
    topology: pegasus

# --- Schedule ---
schedule:
  s_p: 0.4
  A_s: 0.9636    # Advantage2 at s_p=0.4 (from D-Wave spreadsheet)
  B_s: 3.7024
  A_over_B: 0.2603

calibration:
  beta_eff:
    advantage2: 7.219
    system64: 4.289
  # Schedule for system6.4
  system64_A_s: 0.5002
  system64_B_s: 1.9320
  system64_A_over_B: 0.2589

# --- Frustrated campaign parameters ---
phase7_frustrated:
  subsystem_size: 4
  system_size: 12
  coupling_lambda_values: [0.5, 0.7, 1.0]
  disorder_W_values: [0.75, 1.0, 1.25, 1.5]
  disorder_seeds: [42, 123, 456, 789, 1024, 2024, 3141, 4242, 5555, 6789,
                   7070, 8008, 9001, 1111, 2222, 3333, 4444, 5678, 6543, 7654]
  t_hold_values: [100, 500]
  num_reads: 2000
  num_reads_long_pause: 1000  # for t_hold=500 to stay under QPU time limit
  sign_seed_offset: 7777
  sign_flip_probability: 0.5
  graph_type: random_regular
  memory_threshold: 0.05
  n_gauges: 4
  initial_states: [S_up, S_down, S_random]

# Total per QPU: 3 lambda × 4 W × 20 seeds × 2 t_p = 480 conditions
# Each: 3 initial states × 4 gauges = 12 QPU submissions
# Grand total: 480 × 12 = 5760 QPU submissions per QPU
# With 2000 reads at 100μs: ~200μs total anneal time per read → ~400ms per job
# Estimated wall clock: ~2-3 hours per QPU
