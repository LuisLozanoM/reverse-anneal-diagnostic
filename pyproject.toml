[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locth1"
version = "0.1.0"
description = "Research code: subsystem thermalization in programmable quantum annealers."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "h5py>=3.10",
  "pyyaml>=6.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
qpu = [
  "dimod>=0.12",
  "dwave-system>=1.34",
  "dwave-networkx>=0.8",
  "minorminer>=0.2",
  "dwave-samplers>=1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live_qpu: tests that require live QPU credentials and solver access",
  "slow: slower-running offline tests",
]
